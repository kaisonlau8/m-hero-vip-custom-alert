<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VIP 保养提醒控制台{% endblock %}</title>
  <style>{{ ds_css()|safe }}</style>
  {# VIP 站点专属微调（通用样式在 design-system/antd-lite.css） #}
  <style>
    .ant-header .in { max-width: 1080px; }
    .container { max-width: 960px; }
    .vip-meta { margin-left: auto; font-size: var(--ant-font-size-table); color: var(--ant-color-text-tertiary); white-space: nowrap; }
    .vip-nav { display: flex; gap: var(--ant-space-1); }
    .vip-nav a {
      display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px;
      border-radius: var(--ant-radius-md); color: var(--ant-color-text); font-size: var(--ant-font-size-base);
    }
    .vip-nav a:hover { background: rgba(0, 0, 0, .04); text-decoration: none; }
    .vip-nav a.cur { color: var(--ant-primary); font-weight: 600; background: var(--ant-primary-bg); }
    @media (max-width: 768px) { .vip-meta { display: none; } }
  </style>
</head>
<body>
  {{ ds_sprite()|safe }}
  <header class="ant-header"><div class="in">
    <a class="brand" href="/"><svg class="ai" aria-hidden="true"><use href="#i-safety"/></svg>VIP 保养提醒控制台</a>
    <nav class="vip-nav" aria-label="主导航">
      <a href="/" class="{{ 'cur' if request.path == '/' }}"><svg class="ai" aria-hidden="true"><use href="#i-dashboard"/></svg>仪表盘</a>
      <a href="/contacts" class="{{ 'cur' if request.path.startswith('/contacts') }}"><svg class="ai" aria-hidden="true"><use href="#i-team"/></svg>联系人</a>
    </nav>
    <span class="vip-meta">端口 9002</span>
  </div></header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <footer class="ant-page-footer" style="text-align:center">猛士科技 服务运营 — VIP 客户保养提醒</footer>
  <script>{{ ds_cards()|safe }}</script>
</body>
</html>
